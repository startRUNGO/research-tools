name: Daily Paper Digest

on:
  schedule:
    # 每天北京时间 9:00 (UTC 1:00)
    - cron: '0 1 * * *'
  workflow_dispatch: # 允许手动触发

jobs:
  fetch-papers:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch and analyze papers
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python research-tools/scripts/fetch-papers.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Merge into papers.json
        run: |
          TODAY=$(date -u +%Y-%m-%d)
          DAILY_FILE="research-tools/data/papers/${TODAY}.json"
          if [ -f "$DAILY_FILE" ]; then
            node research-tools/scripts/update-papers.js "$DAILY_FILE"
          else
            echo "No daily file generated, skipping merge"
          fi

      - name: Generate RSS feed
        run: node research-tools/scripts/generate-feed.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add research-tools/data/ research-tools/feed.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            TODAY=$(date -u +%Y-%m-%d)
            PAPER_COUNT=$(python3 -c "import json; print(len(json.load(open('research-tools/data/papers/$(date -u +%Y-%m-%d).json'))))" 2>/dev/null || echo "0")
            git commit -m "Paper digest ${TODAY}: +${PAPER_COUNT} new papers [auto]"
            git push
          fi
